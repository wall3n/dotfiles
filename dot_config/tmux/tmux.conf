# ══════════════════════════════════════════════════════════════════
#  TMUX CONFIG — portable (macOS + Linux)
#  Managed by chezmoi
# ══════════════════════════════════════════════════════════════════

# ─── GENERAL ──────────────────────────────────────────────────────

# C-a is the primary prefix, C-b stays available as a secondary one.
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind C-b send-prefix -2

# Instant config reload
bind r source-file ~/.config/tmux/tmux.conf \; display "⚡ Config reloaded"

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# No Escape delay (critical for nvim)
set -sg escape-time 0

# Scrollback
set -g history-limit 50000

# Message display time (ms)
set -g display-time 2000

# Status bar refresh. 5s instead of 1s: same clock accuracy, far fewer wakeups.
set -g status-interval 5

# Focus events: needed for nvim autoread
set -g focus-events on

# True colour
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",kitty:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Mouse: pane resize + scroll
set -g mouse on

# ─── WINDOWS & PANES ──────────────────────────────────────────────

# New windows/panes inherit the current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── VIM-STYLE NAVIGATION ─────────────────────────────────────────
# Pane movement is handled by vim-tmux-navigator (C-h/j/k/l), which
# crosses the nvim <-> tmux boundary transparently. See PLUGINS below.

# Resize panes with HJKL — repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom current pane. Not repeatable: `-r` makes accidental double-toggles easy.
bind m resize-pane -Z

# Last window
bind -r ^ last-window

# Move windows left/right
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ─── COPY MODE (VI) ───────────────────────────────────────────────

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'H' send -X start-of-line
bind-key -T copy-mode-vi 'L' send -X end-of-line

# Copy to the system clipboard through the portable `clipcopy` helper
# (pbcopy on macOS, wl-copy/xclip/xsel on Linux).
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "clipcopy"
bind-key -T copy-mode-vi 'Y' send -X copy-pipe "clipcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clipcopy"

# Paste from the system clipboard
bind p run-shell "clippaste | tmux load-buffer - && tmux paste-buffer"

# Mouse scroll enters copy mode automatically
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

# ─── SESSIONS ─────────────────────────────────────────────────────

# tmux-sessionizer (fzf over project dirs) — replaces the sessionx plugin
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Named session
bind-key N command-prompt -p "Session name:" "new-session -s '%%'"

# Kill current session
bind-key X confirm-before -p "Kill session '#{session_name}'? (y/n)" kill-session

# Keybinding cheatsheet
bind-key ? run-shell "tmux neww hey"

# lazygit in a popup, in the directory of the current pane
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# workmux: agent dashboard in a popup, sidebar toggle
bind-key A display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "workmux dashboard"
bind-key B run-shell -b "workmux sidebar"

# ─── LOOK & FEEL ──────────────────────────────────────────────────

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Closing the last window of a session jumps to another session
# instead of leaving tmux
set -g detach-on-destroy off

# Let apps inside tmux (nvim, ssh) copy to the system clipboard (OSC 52)
set -g set-clipboard on

# ─── GRUVBOX DARK HARD ────────────────────────────────────────────
# Rounded pills use the Nerd Font glyphs U+E0B6 and U+E0B4
# (JetBrainsMono Nerd Font, already required by Ghostty and nvim).
#   bg0_h #1d2021  bg1 #3c3836  bg2 #504945  bg3 #665c54  gray #928374
#   fg #ebdbb2  yellow #fabd2f  blue #83a598  aqua #8ec07c  orange #fe8019

# Pane borders: dim lines, yellow for the active pane (same as lazygit)
set -g pane-border-lines single
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"

# Popups (sessionizer, lazygit, workmux, floax): rounded, dim border
set -g popup-border-lines rounded
set -g popup-border-style "fg=#665c54"

# Copy mode selection and messages
setw -g mode-style "bg=#504945,fg=#ebdbb2"
set -g message-style "bg=#3c3836,fg=#fabd2f,bold"
set -g message-command-style "bg=#3c3836,fg=#fe8019"
setw -g clock-mode-colour "#fabd2f"

# ─── STATUS BAR (top) ─────────────────────────────────────────────
#  [ session ]  1 nvim  [ 2 server ]  3 logs            [  dir ]
# The session pill turns orange while the prefix is active.

set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#928374"

set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#fe8019],#[fg=#83a598]}#[bg=default]#{?client_prefix,#[bg=#fe8019],#[bg=#83a598]}#[fg=#1d2021]#[bold] #S #[nobold]#[bg=default]#{?client_prefix,#[fg=#fe8019],#[fg=#83a598]}  "

set -g status-right-length 60
set -g status-right "#[fg=#3c3836,bg=default]#[fg=#ebdbb2,bg=#3c3836] #{b:pane_current_path} #[fg=#3c3836,bg=default]"

setw -g window-status-separator ""
setw -g window-status-style "fg=#7c6f64,bg=default"
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#fabd2f,bg=default]#[fg=#1d2021,bg=#fabd2f,bold]#I #W#{?window_zoomed_flag, ,}#[fg=#fabd2f,bg=default,nobold]"

# ─── PLUGINS (TPM) ────────────────────────────────────────────────
# Plugins live next to this file (~/.config/tmux/plugins), which is where TPM
# looks by default when the config is under ~/.config/tmux. Using ~/.tmux/plugins
# installs fine but is never sourced at startup.
# Bootstrap: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# Install:   <prefix> + I     Update: <prefix> + U     Clean: <prefix> + alt-u

set -g @plugin 'tmux-plugins/tpm'

# Sane defaults everyone agrees on
set -g @plugin 'tmux-plugins/tmux-sensible'

# NOTE: no tmux-yank here. It loads after this file and silently rebinds y/Y in
# copy-mode-vi, overriding the bindings above. The `clipcopy` helper in
# ~/.local/bin already picks pbcopy / wl-copy / xclip / xsel per platform, so
# the bindings above give identical behaviour on macOS and Linux with one less
# plugin and no load-order surprises.

# Seamless C-h/j/k/l between tmux panes and nvim splits.
# Requires the matching nvim plugin (christoomey/vim-tmux-navigator).
set -g @plugin 'christoomey/vim-tmux-navigator'

# Session persistence across restarts + automatic saving
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Floating scratch pane — Alt+P
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind '-n M-p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#fabd2f'
set -g @floax-text-color '#ebdbb2'
set -g @floax-change-path 'true'

# URLs on screen → fzf picker → browser. <prefix> u
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-fzf-options '-p 60%,40% --prompt="  " --border-label=" Open URL "'

# Hints to copy paths, hashes, IPs and URLs. <prefix> F, jump mode <prefix> j
# (J is taken by resize-pane). fingers takes colour numbers, not hex.
# Installed by Homebrew (brew "tmux-fingers"), not by TPM.
set -g @fingers-hint-style "fg=colour214,bold"
set -g @fingers-highlight-style "fg=colour109"
set -g @fingers-selected-hint-style "fg=colour208,bold"
set -g @fingers-backdrop-style "fg=colour241"
set -g @fingers-jump-key j
if-shell "command -v tmux-fingers" "run 'tmux-fingers load-config'"

# Initialise TPM — must stay the LAST line
run '~/.config/tmux/plugins/tpm/tpm'
