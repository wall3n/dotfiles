# ══════════════════════════════════════════════════════════════════
#  AeroSpace — i3-like tiling for macOS. Managed by chezmoi.
#  Reference: /Applications/AeroSpace.app/Contents/Resources/default-config.toml
#             https://nikitabobko.github.io/AeroSpace/guide
#
#  MODIFIER: ctrl-alt (not alt). On the Spanish ISO layout Option+1/2/3
#  types | @ #, and AeroSpace cannot tell left from right Option, so
#  alt-<digit> bindings would take those symbols away. ctrl-alt also
#  leaves Alt-<key> free for tmux (floax: Alt+p) and nvim.
#
#  ctrl-alt-h/j/k/l        focus          +shift  move window
#  ctrl-alt-1..9           workspace      +shift  send window there
#  ctrl-alt-/  tiles · ctrl-alt-,  accordion · ctrl-alt-f  fullscreen
#  ctrl-alt-tab  last workspace · ctrl-alt-;  service mode
# ══════════════════════════════════════════════════════════════════

config-version = 2

start-at-login = true
auto-reload-config = true # chezmoi apply reloads the layout at once

# Window borders (JankyBorders): Gruvbox yellow for the focused window,
# the same color as the active pane in tmux and lazygit
after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/borders active_color=0xfffabd2f inactive_color=0xff3c3836 width=5.0 style=round hidpi=on',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion: how much of the hidden windows stays visible at the sides.
# On the ultrawide it is the best layout for 3 or more windows.
accordion-padding = 40

default-root-container-layout = 'tiles'
# auto: horizontal on a wide monitor (the MSI), vertical on a tall one
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

key-mapping.preset = 'qwerty'

# ─── Gaps ─────────────────────────────────────────────────────────
# The MSI ultrawide gets wider side gaps, so one window alone does not
# stretch across the full width. Pattern = case-insensitive regex on
# the monitor name (System Settings → Displays). 0 = no extra gap.
[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = [{ monitor.'msi' = 120 }, 10]
outer.right      = [{ monitor.'msi' = 120 }, 10]
outer.top        = 10
outer.bottom     = 10

# ─── Monitors ─────────────────────────────────────────────────────
# Work on the MSI (1-5), chat/music/notes on the laptop (6-9).
# Without the MSI connected, every workspace falls back to the laptop.
[workspace-to-monitor-force-assignment]
1 = ['msi', 'main']
2 = ['msi', 'main']
3 = ['msi', 'main']
4 = ['msi', 'main']
5 = ['msi', 'main']
6 = ['built-in', 'main']
7 = ['built-in', 'main']
8 = ['built-in', 'main']
9 = ['built-in', 'main']

# ─── Floating windows ─────────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'layout floating'

# ─── Main mode ────────────────────────────────────────────────────
[mode.main.binding]
ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'
ctrl-alt-f = 'fullscreen'
ctrl-alt-shift-f = 'layout floating tiling'

ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

ctrl-alt-minus = 'resize smart -50'
ctrl-alt-equal = 'resize smart +50'

ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
ctrl-alt-7 = 'workspace 7'
ctrl-alt-8 = 'workspace 8'
ctrl-alt-9 = 'workspace 9'

ctrl-alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
ctrl-alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
ctrl-alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
ctrl-alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
ctrl-alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
ctrl-alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
ctrl-alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
ctrl-alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
ctrl-alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

ctrl-alt-tab = 'workspace-back-and-forth'
ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

ctrl-alt-enter = 'exec-and-forget open -a Ghostty'

ctrl-alt-semicolon = 'mode service'

# ─── Service mode: one key, then back to main ─────────────────────
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']          # reset the layout
f = ['layout floating tiling', 'mode main']          # float / tile
backspace = ['close-all-windows-but-current', 'mode main']
ctrl-alt-shift-h = ['join-with left', 'mode main']
ctrl-alt-shift-j = ['join-with down', 'mode main']
ctrl-alt-shift-k = ['join-with up', 'mode main']
ctrl-alt-shift-l = ['join-with right', 'mode main']
