# ==============================================================================
#  mise — one version manager for every runtime (written in Rust)
#  Replaces nvm / fnm / pyenv / rbenv / gvm and (for plain JDKs) SDKMAN.
#
#  Per-project override:  mise use java@17 node@20   -> writes ./mise.toml
#  Legacy files are honoured too (.nvmrc, .java-version, .python-version).
# ==============================================================================

[tools]
java   = "temurin-21"   # LTS, matches the JavaSE-21 runtime declared for jdtls
node   = "24"     # Node 24 LTS line, do not move to 26
python = "3.13"

# Global CLI tools from PyPI, each in its own isolated venv (uv tool install)
uv = "latest"
"pipx:markitdown" = { version = "latest", extras = "all" }  # any doc -> Markdown
"pipx:opendataloader-pdf" = "latest"                        # PDF -> Markdown/JSON, needs java

[settings]
# Honour .nvmrc / .java-version / .python-version left by other tools
idiomatic_version_file_enable_tools = ["node", "java", "python"]

# Install a missing version automatically when a project asks for it
not_found_auto_install = true

# Verify checksums / signatures on download
lockfile = true

[settings.status]
# Warn when a directory pins tool versions that are not installed.
# Valid values: never | always | if_other_versions_installed
missing_tools = "always"
