# Shcemas
"$schema" = 'https://starship.rs/config-schema.json'

# General options
add_newline = false 
format = """$directory$character"""
palette = "gruvbox_dark"
right_format = """$all"""

# Modules

[character] 
success_symbol = '[➜](bold green)' 
error_symbol = '[➜](bold red) '

[git_branch]
format =  '[$symbol$branch(:$remote_branch)]($style)'
style = 'bold green'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'

[c]
format = '\[[$symbol($version)]($style)\]'
version_format = 'v${major}'

[cpp]
disabled = false
format = '\[[$symbol($version)]($style)\]'

[cmd_duration]
disabled = true

[java]
format = '\[[$symbol($version)]($style)\]'
version_format = 'v${major}'

[lua]
format = '\[[$symbol($version)]($style)\]'

[nodejs]
format = '\[[$symbol($version)]($style)\]'

# Colorscheme — Gruvbox Dark Hard
# Las claves usan nombres de color estándar (green/red/...), así que los
# estilos existentes tipo 'bold green' resuelven automáticamente a Gruvbox.
[palettes.gruvbox_dark]
bg      = "#1d2021"
fg      = "#ebdbb2"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
purple  = "#b16286"
aqua    = "#689d6a"
orange  = "#d65d0e"
gray    = "#928374"
# Variantes bright
bright_red    = "#fb4934"
bright_green  = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue   = "#83a598"
bright_purple = "#d3869b"
bright_aqua   = "#8ec07c"
